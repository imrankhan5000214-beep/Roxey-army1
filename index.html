<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxey Army - Daily Premium Signals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #111111, #1a1a1a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            border: 2px solid #d4af37;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 3px solid #d4af37;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 26px;
            color: #d4af37;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .cta-button {
            display: block;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(230, 126, 34, 0.6);
        }
        .cta-subtext {
            font-size: 12px;
            color: #888888;
            margin-bottom: 25px;
        }
        .timer-box {
            background: #252525;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #333333;
        }
        .timer-title {
            font-size: 12px;
            color: #e74c3c;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .timer-display {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile / Logo Section -->
        <div class="profile-container">
            <img src="logo.jpg" alt="Roxey Army Logo">
        </div>

        <!-- Title & Subtitle -->
        <h1>Roxey Army</h1>
        <p class="subtitle">Daily premium signals, straight to your Telegram.</p>

        <!-- Telegram Join Button -->
        <a href="https://t.me/+rA7XhaGRriRlMzhl" class="cta-button" target="_blank">
            ✈ Join Telegram
        </a>
        <div class="cta-subtext">Free to join · One tap to open Telegram</div>

        <!-- Countdown Box -->
        <div class="timer-box">
            <div class="timer-title">⚡ Offer Ends In</div>
            <div class="timer-display" id="countdown">23 Seconds remaining</div>
        </div>
    </div>

    <script>
        // Simple Dynamic Countdown Simulation for Urgency
        let timeLeft = 23;
        const countdownElement = document.getElementById("countdown");
        
        setInterval(() => {
            if (timeLeft > 1) {
                timeLeft--;
                countdownElement.innerText = timeLeft + " Seconds remaining";
            } else {
                timeLeft = 30; // Loop back for engagement
            }
        }, 1000);
    </script>

</body>
</html>
